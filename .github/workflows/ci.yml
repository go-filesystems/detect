name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The core detect module composes with only `interface` as a sibling
  # checkout. GOWORK=off keeps any developer go.work out of CI.
  GOWORK: off

jobs:
  # ----------------------------------------------------------------------
  # Core package — depends ONLY on go-filesystems/interface (sibling replace)
  # plus go-volumes/safeio (from the proxy). Native runners run the full
  # race+coverage suite; the coverage gate is enforced here.
  # ----------------------------------------------------------------------
  core-native:
    name: core native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout detect
        uses: actions/checkout@v7
        with:
          path: detect

      # go.mod carries `replace github.com/go-filesystems/interface =>
      # ../interface`, so the sibling module must sit next to this one.
      - name: Checkout interface (sibling replace target)
        uses: actions/checkout@v7
        with:
          repository: go-filesystems/interface
          path: interface

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: detect/go.mod

      - name: Vet
        working-directory: detect
        run: go vet -mod=mod ./...

      - name: Build
        working-directory: detect
        run: go build -mod=mod ./...

      - name: Test (race + coverage)
        working-directory: detect
        run: go test -mod=mod -race -coverprofile=cover.out -covermode=atomic ./...

      - name: Enforce coverage gate
        working-directory: detect
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 100.0) ? 0 : 1 }' \
            || { echo "coverage ${pct}% below gate 100.0%"; exit 1; }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core-${{ matrix.arch }}
          path: detect/cover.out
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # Core package — emulated 64-bit arches. Cross-compile a static
  # (CGO_ENABLED=0) test binary and run it under QEMU. s390x is big-endian,
  # exercising the explicit binary.BigEndian / LittleEndian probe decoding.
  # ----------------------------------------------------------------------
  core-emulated:
    name: core emulated ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu: rv64,v=true,vlen=128
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu: la464
          - arch: ppc64le
            image: debian:trixie
            qemu: power9
          - arch: s390x
            image: debian:trixie
            qemu: qemu
    steps:
      - name: Checkout detect
        uses: actions/checkout@v7
        with:
          path: detect

      - name: Checkout interface (sibling replace target)
        uses: actions/checkout@v7
        with:
          repository: go-filesystems/interface
          path: interface

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: detect/go.mod

      - name: Register QEMU binfmt handlers
        run: docker run --rm --privileged tonistiigi/binfmt --install all

      - name: Cross-compile per-package test binaries
        working-directory: detect
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/tests
          for pkg in $(go list -mod=mod ./...); do
            name=$(echo "$pkg" | tr '/' '_')
            go test -mod=mod -c -cover -o "/tmp/tests/${name}.test" "$pkg"
          done
          ls -la /tmp/tests

      - name: Run test binaries under QEMU (${{ matrix.arch }})
        env:
          QEMU_CPU: ${{ matrix.qemu }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(/tmp/tests/*.test)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "no test binaries to run"; exit 0
          fi
          rc=0
          for bin in "${bins[@]}"; do
            echo "::group::$(basename "$bin")"
            if ! docker run --rm \
              --platform linux/${{ matrix.arch }} \
              -e QEMU_CPU="${QEMU_CPU}" \
              --user 1000:1000 \
              -v /tmp/tests:/t -w /t \
              ${{ matrix.image }} \
              "./$(basename "$bin")" -test.v; then
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

  # ----------------------------------------------------------------------
  # Adapter module — detect/fat32reg. It imports the fat32 driver, so it
  # carries its own sibling replaces for interface, detect and fat32. All
  # three are checked out flat next to each other.
  # ----------------------------------------------------------------------
  adapter-native:
    name: adapter native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout detect
        uses: actions/checkout@v7
        with:
          path: detect

      - name: Checkout interface (sibling replace target)
        uses: actions/checkout@v7
        with:
          repository: go-filesystems/interface
          path: interface

      - name: Checkout fat32 driver (sibling replace target)
        uses: actions/checkout@v7
        with:
          repository: go-filesystems/fat32
          path: fat32

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: detect/fat32reg/go.mod

      - name: Vet
        working-directory: detect/fat32reg
        run: go vet -mod=mod ./...

      - name: Build
        working-directory: detect/fat32reg
        run: go build -mod=mod ./...

      - name: Test (race + coverage)
        working-directory: detect/fat32reg
        run: go test -mod=mod -race -coverprofile=cover.out -covermode=atomic ./...

      - name: Enforce coverage gate
        working-directory: detect/fat32reg
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 100.0) ? 0 : 1 }' \
            || { echo "coverage ${pct}% below gate 100.0%"; exit 1; }

  adapter-emulated:
    name: adapter emulated ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu: rv64,v=true,vlen=128
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu: la464
          - arch: ppc64le
            image: debian:trixie
            qemu: power9
          - arch: s390x
            image: debian:trixie
            qemu: qemu
    steps:
      - name: Checkout detect
        uses: actions/checkout@v7
        with:
          path: detect

      - name: Checkout interface (sibling replace target)
        uses: actions/checkout@v7
        with:
          repository: go-filesystems/interface
          path: interface

      - name: Checkout fat32 driver (sibling replace target)
        uses: actions/checkout@v7
        with:
          repository: go-filesystems/fat32
          path: fat32

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: detect/fat32reg/go.mod

      - name: Register QEMU binfmt handlers
        run: docker run --rm --privileged tonistiigi/binfmt --install all

      - name: Cross-compile adapter test binary
        working-directory: detect/fat32reg
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/atests
          for pkg in $(go list -mod=mod ./...); do
            name=$(echo "$pkg" | tr '/' '_')
            go test -mod=mod -c -cover -o "/tmp/atests/${name}.test" "$pkg"
          done
          ls -la /tmp/atests

      - name: Run adapter test binary under QEMU (${{ matrix.arch }})
        env:
          QEMU_CPU: ${{ matrix.qemu }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(/tmp/atests/*.test)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "no test binaries to run"; exit 0
          fi
          rc=0
          for bin in "${bins[@]}"; do
            echo "::group::$(basename "$bin")"
            if ! docker run --rm \
              --platform linux/${{ matrix.arch }} \
              -e QEMU_CPU="${QEMU_CPU}" \
              --user 1000:1000 \
              -v /tmp/atests:/t -w /t \
              ${{ matrix.image }} \
              "./$(basename "$bin")" -test.v; then
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc
